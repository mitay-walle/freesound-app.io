name: Deploy static content to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp -R public/. _site/
          sed -i 's|href="/style.css"|href="./style.css?v=3"|' _site/index.html
          sed -i 's|src="/fields.js"|src="./fields.js"|' _site/index.html
          sed -i 's|src="/controls.js"|src="./controls.js"|' _site/index.html
          sed -i 's|src="/app.js"|src="./static-adapter.js?v=2"></script><script src="./app.js"|' _site/index.html
          touch _site/.nojekyll
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
