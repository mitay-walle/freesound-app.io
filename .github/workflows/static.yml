name: Deploy static content to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp -R public/. _site/
          python - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path("_site/index.html")
          html = path.read_text(encoding="utf-8")
          sha = os.environ["GITHUB_SHA"]
          assets = ["style.css", "fields.js", "controls.js", "i18n/ru.js", "i18n/en.js", "i18n/zh.js", "i18n/ko.js", "ui-prefs.js", "static-adapter.js", "app.js", "assets/settings-waveform.webp"]

          html = html.replace('href="/style.css"', 'href="./style.css"')
          html = html.replace('src="/fields.js"', 'src="./fields.js"')
          html = html.replace('src="/controls.js"', 'src="./controls.js"')
          html = html.replace('src="/app.js"', 'src="./static-adapter.js"></script><script src="./app.js"')

          for asset in assets:
              pattern = r'(\./' + re.escape(asset) + r')(?:\?v=[^"\']+)?'
              html = re.sub(pattern, lambda match: match.group(1) + "?v=" + sha, html)

          path.write_text(html, encoding="utf-8")
          PY
          touch _site/.nojekyll
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
